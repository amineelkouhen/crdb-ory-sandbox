image:
  registry: ${REGISTRY}
  repository: ${IMAGE}
  tag: ${RELEASE}
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ory-oel-gcr-secret
service:
  public:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
    port: ${PUBLIC_PORT}
    name: hydra-http-public
  admin:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
    port: ${ADMIN_PORT}
    name: hydra-http-admin
maester:
  enabled: false
secret:
  secretsSystem: ${SYSTEM_SECRET}
hydra:
  dev: true
  automigration:
    enabled: true
  config:
    serve:
      public:
        port: ${PUBLIC_PORT}
      admin:
        port: ${ADMIN_PORT}
    dsn: "cockroach://root@${CRDB_FQDN}:26257/hydra?sslmode=disable"
    urls:
      self:
        issuer: ${ISSUER_URL}
        public: ${ISSUER_URL}
  secrets:
    system:
      - ${SYSTEM_SECRET}
